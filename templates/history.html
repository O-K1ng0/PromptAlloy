<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptAlloy History</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="bg-canvas" aria-hidden="true">
    <div class="bg-orb bg-orb--1"></div>
    <div class="bg-orb bg-orb--2"></div>
  </div>
  <div class="app-wrapper">
    <header class="header">
      <div class="header-inner">
        <div class="brand">
          <img src="/static/logo.svg" alt="PromptAlloy" class="brand-logo" />
          <span class="brand-name">PromptAlloy</span>
        </div>
        <p class="brand-tagline">History</p>
        <a class="btn btn--ghost header-history-link" href="/" rel="noopener">Back To App</a>
      </div>
    </header>

    <main class="main history-main">
      <section class="panel">
        <div class="panel__head">
          <h2 class="panel__title">Saved Sessions</h2>
          <button id="clearHistoryBtn" class="btn btn--ghost" type="button">Clear History</button>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="alert" aria-live="polite"></div>
  <script src="/static/js/history.js"></script>
</body>
</html>
